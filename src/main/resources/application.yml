server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: news-management

  # Cấu hình Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/news_management_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  # Cấu hình Flyway Migration - Quản trị phiên bản schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      # validate: Flyway chịu trách nhiệm tạo schema, Hibernate chỉ kiểm tra tính nhất quán
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Giới hạn kích thước upload file
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:10MB}

# Cấu hình biến toàn cục ứng dụng
app:
  # Cấu hình JWT
  jwt:
    secret: ${JWT_SECRET:NewsManagementSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 giờ
  
  # Cấu hình Upload File
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
